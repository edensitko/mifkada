name: Release
# תג v* (למשל v0.2.0) בונה קבצי התקנה של Tauri לשלוש המערכות ויוצר טיוטת release ב-GitHub. הפרסום עצמו ידני (Publish בטיוטה).
# בלי תעודות: האפליקציה למק חתומה אד-הוק (נפתחת בקליק ימני ← פתח), ו-Windows לא חתום (SmartScreen מזהיר).
# חתימה ונוטריזציה במק (ה-CLI של Tauri משתמש בהם לבד כשהם קיימים), ב-Settings ← Secrets:
#   APPLE_CERTIFICATE (תעודת Developer ID Application כ-base64 של p12), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_SIGNING_IDENTITY ("Developer ID Application: <שם> (<צוות>)"), APPLE_ID, APPLE_PASSWORD (סיסמת אפליקציה), APPLE_TEAM_ID.
# האפליקציה לא כוללת את Claude Code: היא משתמשת ב-claude שמותקן אצל המשתמש (server/src/claudeExe.ts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            files: |
              desktop-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            files: |
              desktop-tauri/target/release/bundle/appimage/*.AppImage
              desktop-tauri/target/release/bundle/deb/*.deb
          - os: windows-latest
            files: |
              desktop-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    # Windows עוד לא נבדק על מחשב אמיתי: כישלון שם לא עוצר את שאר הבנייה
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri
      - name: Linux deps (WebKitGTK, tray)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev
      - run: git config --global user.email ci@example.com && git config --global user.name CI && git config --global init.defaultBranch main && git config --global core.autocrlf false
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm test
      - run: npm run tauri:release
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: mifkada-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/**/*
          generate_release_notes: true
